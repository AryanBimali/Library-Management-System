<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book List</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>Library Management System</h1>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="books.html">Books</a>
    <a href="authors.html">Authors</a>
    <a href="genres.html">Genres</a>
  </nav>

  <main>
    <div class="page-heading">
      <h2>Book List</h2>
      <a href="book-form.html" class="button">Add Book</a>
    </div>

    <div class="search-filter">
      <input type="text" id="searchBook" placeholder="Search book by title..." oninput="displayBooks()">

      <select id="genreFilter" onchange="displayBooks()">
        <option value="">All Genres</option>
      </select>
    </div>

    <table>
      <thead>
        <tr>
          <th>Cover</th>
          <th>Title</th>
          <th>Author</th>
          <th>Genre</th>
          <th>Stock</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="bookTableBody"></tbody>
    </table>
  </main>

  <script src="script.js"></script>
  <script>
    displayBooks();
    loadGenreFilter();
  </script>

</body>

</html>
